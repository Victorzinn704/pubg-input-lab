; Exemplos de estimulo. Nenhum perfil foi calibrado para uma arma do PUBG.
; Cada segmento: fim acumulado em ms, deslocamento X por passo, deslocamento Y por passo.
; Positivo: direita/baixo. Negativo: esquerda/cima. Decimais usam ponto.
[Lab]
TargetExe=TslGame.exe
StartProfile=Controle
StartMode=dry_run
PollMs=10
MaxBurstMs=6000
SessionLimitSeconds=7200
MaxLateMs=100
MaxStep=12

[Profile:Controle]
Label=Controle - sem deslocamento
IntervalMs=20
Segments=3000,0,0

[Profile:VerticalLeve]
Label=Vertical leve - exemplo para calibracao
IntervalMs=20
Segments=1000,0,1;3000,0,1.5

[Profile:VerticalProgressivo]
Label=Vertical progressivo - exemplo para calibracao
IntervalMs=20
Segments=500,0,1;1500,0,2;3000,0,3

[Profile:DoisEixos]
Label=Dois eixos - exemplo para calibracao
IntervalMs=20
Segments=1000,0.5,1;2000,-0.5,1.5;3000,0,2

